services:
  ir-remote-hub:
    build: .
    container_name: ir-remote-hub
    privileged: true
    environment:
      - TZ=Asia/Tokyo
      - IR_HUB_DATA_DIR=/app/data
    volumes:
      # A directory (not a single file) so config writes can use atomic rename.
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
